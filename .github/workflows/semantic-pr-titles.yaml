# Workflow: Semantic PR Titles
# Purpose: Enforce Conventional Commits in PR titles for automated releases.
# Triggers: pull_request [opened, edited, reopened, synchronize]

name: Semantic PR Titles
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
jobs:
  pr-title-lint:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
